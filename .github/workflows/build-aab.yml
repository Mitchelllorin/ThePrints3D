name: Build Android AAB

# Produces a SIGNED Android App Bundle (.aab) for upload to the Google Play
# Console. Run it manually from the Actions tab (Run workflow), or by pushing a
# version tag like v1.2.0. The signed .aab is attached as a downloadable
# artifact on the run.
#
# ── Required repository secrets (Settings → Secrets and variables → Actions) ──
#   ANDROID_KEYSTORE_BASE64    base64 of your upload keystore (.jks/.keystore)
#                              create with:  base64 -w0 upload-keystore.jks   (Linux)
#                                            base64 -i  upload-keystore.jks   (macOS)
#   ANDROID_KEYSTORE_PASSWORD  the keystore (store) password
#   ANDROID_KEY_ALIAS          the key alias inside the keystore (e.g. theprints3d)
#   ANDROID_KEY_PASSWORD       the key (alias) password
#
# The keystore and passwords never appear in the repo — only as encrypted
# secrets, decoded to a temp file at build time. build.gradle reads them from
# the ANDROID_KEYSTORE_PATH / ANDROID_KEY_* env vars set below.
#
# ── Optional: upload straight to Google Play ──
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON  the whole JSON key of a Google Cloud service
#                              account that has been invited in Play Console →
#                              Users and permissions, with release rights.
# With it set, every run also sends the signed bundle to the track chosen when
# the run starts (closed testing by default). Without it, the run just builds
# the bundle as before and you upload it by hand.

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName for this build (e.g. 1.2.0). Blank = keep build.gradle default.'
        required: false
        default: ''
      track:
        description: 'Play track to upload to (needs GOOGLE_PLAY_SERVICE_ACCOUNT_JSON). alpha = closed testing.'
        required: false
        default: 'alpha'
        type: choice
        options: [alpha, internal, beta, production]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Read by the upload step's `if`, which cannot see secrets directly.
      PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app (capacitor mode)
        run: npm run build -- --mode capacitor

      - name: Sync Capacitor to Android
        run: |
          # Clear stale web assets so `cap sync` starts from a clean slate.
          # Keep in sync with the matching step in build-android.sh.
          rm -rf android/app/src/main/assets/public \
                 android/app/src/main/assets/capacitor.config.json \
                 android/app/src/main/assets/capacitor.plugins.json
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # DO NOT LET IT INSTALL ITS DEFAULTS. The action's default `packages`
          # is `tools platform-tools`, and Google has removed `tools` from the
          # SDK repository — sdkmanager answers "Failed to find package 'tools'"
          # and exits 1, which fails the step before a line of the app is built.
          # Nothing here was edited to cause that; the same file built fine on
          # 11 Sep and rotted underneath us.
          #
          # Empty means the action only puts the runner's existing SDK on PATH
          # and sets ANDROID_HOME, which is all this build wants from it — the
          # very next step installs the one platform and build-tools we need,
          # by name.
          packages: ''

      - name: Install Android SDK platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || echo "build-tools 36.0.0 unavailable — AGP will resolve its own"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. Add your upload keystore + password/alias secrets (see this workflow's header) before running."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build release AAB
        working-directory: android
        env:
          # build.gradle reads these to sign the release bundle.
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Unique, increasing versionCode per run so Play never rejects a duplicate.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.event.inputs.versionName }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify the AAB exists
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::AAB not found at $AAB — the build likely failed above."; exit 1; }
          ls -lh "$AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: theprints3d-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # Only when the Play key is there — a run without it still builds the
      # bundle and stops here, as it always has.
      - name: Upload to Google Play
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.theprints3d.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'alpha' }}
          status: completed
