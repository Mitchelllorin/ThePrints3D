name = "ask-ai"
main = "src/worker.ts"
compatibility_date = "2024-11-01"

# Rate-cap storage. Create it with:  wrangler kv namespace create ASK_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "ASK_KV"
id = "REPLACE_WITH_KV_ID"

[vars]
FREE_PER_DAY = "10"   # free AI questions per device per day
