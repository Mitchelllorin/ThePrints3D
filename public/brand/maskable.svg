<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="ThePrints3D">
  <title>ThePrints3D</title>
  <!--
    THE MASKABLE ICON — the tile art, pulled in so a mask cannot cut it.

    A maskable icon is cropped to an arbitrary shape: a circle, a squircle, a
    rounded square, whatever the launcher feels like. Only the central ~80% is
    guaranteed, and Android's adaptive masks go as tight as 66%. icon.svg is
    deliberately the opposite — full-bleed, scaled up to fill its square — so
    declaring it `maskable` (which manifest.json did, for 192 and 512) promised
    something it cannot keep: under a circular mask the roof and the print, the
    two things that say what the app does, are the first to be cut off.

    So the maskable variant is its own file: the same four layers at 0.78, the
    same scale the Android adaptive foreground uses, which puts the corners of
    the stack ~164 from the centre — inside the 169 the tightest mask leaves.

    The background is the full square, and it must be, because a mask crops the
    art but still fills its whole shape with whatever is behind it.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18243f"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#tile)"/>
  <g transform="translate(256,256) scale(0.78) translate(-256,-251.5)">
    <path d="M126 352 L256 417 L386 352 L256 287 Z" fill="#17305a" stroke="#5b8ac7" stroke-width="3"/>
    <path d="M144 352 L256 408 L368 352 L256 296 Z" fill="none" stroke="#9dbcea" stroke-width="4.5"/>

    <path d="M144 306 L256 362 L368 306 L256 250 Z" fill="#dce7f8"/>
    <path d="M144 306 L256 362 L256 374 L144 318 Z" fill="#9fb4d6"/>
    <path d="M256 362 L368 306 L368 318 L256 374 Z" fill="#8da5cc"/>

    <path d="M224 154 L112 210 L125 216.5 L237 160.5 Z" fill="#e8effb"/>
    <path d="M237 160.5 L125 216.5 L125 272.5 L237 216.5 Z" fill="#b9cae7"/>
    <path d="M400 210 L288 154 L275 160.5 L387 216.5 Z" fill="#e8effb"/>
    <path d="M387 216.5 L275 160.5 L275 216.5 L387 272.5 Z" fill="#a7bbdc"/>
    <path d="M112 242 L224 298 L224 354 L112 298 Z" fill="#3f5f9e"/>
    <path d="M112 242 L224 298 L237 291.5 L125 235.5 Z" fill="#e8effb"/>
    <path d="M288 298 L400 242 L400 298 L288 354 Z" fill="#4d72b8"/>
    <path d="M288 298 L400 242 L387 235.5 L275 291.5 Z" fill="#e8effb"/>
    <path d="M327.2 286.4 L353 273.5 L353 321.5 L327.2 334.4 Z" fill="#16264a"/>

    <path d="M130.6 205.3 L256 268 L318.7 148.7 L193.3 86 Z" fill="#a9c6f5"/>
    <path d="M256 142.6 L381.4 205.3 L318.7 148.7 L193.3 86 Z" fill="#6d97dd"/>
  </g>
</svg>
