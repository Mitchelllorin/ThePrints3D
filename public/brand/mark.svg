<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="ThePrints3D">
  <title>ThePrints3D</title>
  <!--
    THE CANONICAL MARK. A plan on the grid, EXPLODED: floor slab down on the
    grid, walls lifted clear of it, roof lifted clear of them. Three layers
    with daylight between them, because the explode is the feature — the mark
    should be the app doing its one trick, not a picture of a house.

    A lifted roof alone did not say that. A roof sitting on a solid box reads
    as a house with the lid off; it is the gap under the WALLS that says the
    whole assembly comes apart.

    Isometric frame (centre 256,250): +x = (+112,+56), +y = (-112,+56),
    wall height 56. A diamond at centre (cx,cy) is
      Bk(cx, cy-56)  R(cx+112, cy)  F(cx, cy+56)  L(cx-112, cy).

    The explode is two lifts up the screen, and nothing else moves:
      walls  46 clear of the slab   (measured at the front vertex)
      roof   22 further still, keeping ~25 of daylight over the wall top

    Every number below comes off that frame and those two lifts — change the
    frame or the lifts, not the individual points.

    Transparent ground on purpose: this is the mark for use on any surface.
    For the app tile see icon.svg, which is this mark on the brand navy and
    deliberately NOT exploded — at 48px the gaps close up into mush.
  -->
  <defs>
    <linearGradient id="roofFront" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#b3cdf8" stop-opacity=".94"/>
      <stop offset="1" stop-color="#6d97dd" stop-opacity=".84"/>
    </linearGradient>
    <linearGradient id="roofBack" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#84a9e9" stop-opacity=".52"/>
      <stop offset="1" stop-color="#3f66b4" stop-opacity=".42"/>
    </linearGradient>
    <radialGradient id="gridFalloff" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0.45" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="512" height="512" fill="url(#gridFalloff)"/></mask>
  </defs>

  <!-- the blueprint grid the building sits on -->
  <g mask="url(#gridMask)" stroke="#9fbdea" stroke-width="2.2" fill="none" opacity=".85">
    <path d="M144 306 L368 418"/><path d="M200 278 L424 390"/><path d="M88 334 L312 446"/>
    <path d="M256 250 L480 362"/><path d="M32 362 L256 474"/>
    <path d="M368 306 L144 418"/><path d="M312 278 L88 390"/><path d="M424 334 L200 446"/>
    <path d="M256 250 L32 362"/><path d="M480 362 L256 474"/>
  </g>

  <!-- FLOOR SLAB — left on the grid, where the walls used to sit. Given real
       thickness so the layer reads as a plate rather than a shadow. -->
  <path d="M144 306 L256 362 L368 306 L256 250 Z" fill="#dce7f8"/>
  <path d="M144 306 L256 362 L256 374 L144 318 Z" fill="#9fb4d6"/>
  <path d="M256 362 L368 306 L368 318 L256 374 Z" fill="#8da5cc"/>

  <!-- WALLS — open-topped, lifted 46 clear of the slab: floor you see through
       the top, the two far inner faces, then the two facing us. -->
  <path d="M144 204 L256 260 L368 204 L256 148 Z" fill="#e8effb"/>
  <path d="M144 204 L256 148 L256 162 L144 218 Z" fill="#b9cae7"/>
  <path d="M256 148 L368 204 L368 218 L256 162 Z" fill="#a7bbdc"/>
  <path d="M144 204 L256 260 L256 316 L144 260 Z" fill="#3f5f9e"/>
  <path d="M256 260 L368 204 L368 260 L256 316 Z" fill="#4d72b8"/>
  <path d="M168.6 228.3 L195.5 241.8 L195.5 261.8 L168.6 248.3 Z" fill="#dce7f8"/>
  <path d="M295.2 248.4 L321 235.5 L321 283.5 L295.2 296.4 Z" fill="#2b4478"/>

  <!-- ROOF — lifted clear again, translucent so both slopes read -->
  <path d="M130.6 172 L256 234.7 L318.7 115.4 L193.3 52.7 Z" fill="url(#roofFront)"/>
  <path d="M256 109.3 L381.4 172 L318.7 115.4 L193.3 52.7 Z" fill="url(#roofBack)"/>
  <g stroke="#5b83c9" stroke-width="3" fill="none" stroke-linejoin="round">
    <path d="M130.6 172 L256 234.7 L318.7 115.4 L193.3 52.7 Z"/>
    <path d="M256 109.3 L381.4 172 L318.7 115.4"/>
    <path d="M256 109.3 L193.3 52.7"/>
  </g>
</svg>
