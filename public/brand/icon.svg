<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="ThePrints3D">
  <title>ThePrints3D</title>
  <!--
    THE APP TILE. The same four layers as mark.svg — print, slab, walls, roof —
    cut down for small sizes.

    IT USED NOT TO EXPLODE AT ALL. The reasoning was that at 48px the gaps close
    up into mush, which is true of the full-size lifts. But the result was a tile
    showing a plain house: the one thing the app is for, left out of the icon
    that represents it. A launcher full of app icons is exactly where a mark has
    to say what its app does.

    So it explodes, less. The lifts are cut roughly in half (46 under the slab,
    24 under the walls, 14 under the roof) — enough that four distinct layers
    read at 48px, not so much that they drift into four unrelated shapes.

    THE PRINT DOES NOT MOVE. It is the drawing the building came from, and it
    carries the ASSEMBLED footprint, not the shape of the exploded stack above
    it. You explode the model; the print stays put and stays whole. On the tile
    it is the sheet and the footprint outline only — the wall thickness and the
    door swing that mark.svg carries are detail that turns to fuzz this small.

    The grid is still dropped here: a 2px grid under a translucent layer is the
    first thing to go at icon sizes, and the sheet now does the job the grid was
    doing (giving the building something to stand on).

    Frame and lifts as mark.svg. Content spans y 86..417, centred 251.5, so the
    group only nudges it onto the tile centre — scale stays at 1 so the taller
    four-layer stack does not push art out under an adaptive launcher mask.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18243f"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#tile)"/>
  <g transform="translate(256,256) scale(1.2) translate(-256,-251.5)">
    <!-- THE PRINT — a FILLED sheet, then the assembled footprint drawn on it.
         Filled because at 48px an unfilled outline is a few stray hairlines
         under the building; a solid shape is a sheet of paper. -->
    <path d="M126 352 L256 417 L386 352 L256 287 Z" fill="#17305a" stroke="#5b8ac7" stroke-width="3"/>
    <!-- Dimmer than the slab above it ON PURPOSE. At 48px a footprint drawn as
         bright as the building put two white bands at the bottom of the tile
         and the eye could not tell which was the house. The building leads; the
         print is what it stands on. -->
    <path d="M144 352 L256 408 L368 352 L256 296 Z" fill="none" stroke="#9dbcea" stroke-width="4.5"/>

    <!-- FLOOR SLAB — 46 clear of the print -->
    <path d="M144 306 L256 362 L368 306 L256 250 Z" fill="#dce7f8"/>
    <path d="M144 306 L256 362 L256 374 L144 318 Z" fill="#9fb4d6"/>
    <path d="M256 362 L368 306 L368 318 L256 374 Z" fill="#8da5cc"/>

    <!-- WALLS — open-topped, 24 clear of the slab -->
    <path d="M224 154 L112 210 L125 216.5 L237 160.5 Z" fill="#e8effb"/>
    <path d="M237 160.5 L125 216.5 L125 272.5 L237 216.5 Z" fill="#b9cae7"/>
    <path d="M400 210 L288 154 L275 160.5 L387 216.5 Z" fill="#e8effb"/>
    <path d="M387 216.5 L275 160.5 L275 216.5 L387 272.5 Z" fill="#a7bbdc"/>
    <path d="M112 242 L224 298 L224 354 L112 298 Z" fill="#3f5f9e"/>
    <path d="M112 242 L224 298 L237 291.5 L125 235.5 Z" fill="#e8effb"/>
    <path d="M288 298 L400 242 L400 298 L288 354 Z" fill="#4d72b8"/>
    <path d="M288 298 L400 242 L387 235.5 L275 291.5 Z" fill="#e8effb"/>
    <path d="M327.2 286.4 L353 273.5 L353 321.5 L327.2 334.4 Z" fill="#16264a"/>

    <!-- ROOF — 14 clear of the wall top. Opaque here: a translucent slope over
         a busy stack is the first thing to turn to mush at 48px. -->
    <path d="M130.6 205.3 L256 268 L318.7 148.7 L193.3 86 Z" fill="#a9c6f5"/>
    <path d="M256 142.6 L381.4 205.3 L318.7 148.7 L193.3 86 Z" fill="#6d97dd"/>
  </g>
</svg>
